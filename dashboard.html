<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Audio Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="topbar">
    <span class="brand">Audio Guestbook</span>
    <button type="button" class="btn-text" id="logoutBtn" style="width:auto;">Log out</button>
  </div>

  <div class="card wide">
    <h1 class="heading" id="eventTitle">Loading…</h1>
    <p class="subtext" id="eventMeta"></p>

    <div class="link-box" id="linkBox" style="margin-bottom:26px;" hidden>
      <span id="guestLink"></span>
      <button type="button" class="btn-text" id="copyBtn">Copy</button>
    </div>

    <p class="status" id="pendingBanner" hidden>Your guestbook is pending admin approval. Guests can't record messages yet — you'll be notified once it's approved.</p>
    <p class="status" id="statusText"></p>

    <div class="message-list" id="messagesList" hidden></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
  const eventTitle = document.getElementById('eventTitle');
  const eventMeta = document.getElementById('eventMeta');
  const linkBox = document.getElementById('linkBox');
  const guestLinkEl = document.getElementById('guestLink');
  const copyBtn = document.getElementById('copyBtn');
  const statusText = document.getElementById('statusText');
  const pendingBanner = document.getElementById('pendingBanner');
  const messagesList = document.getElementById('messagesList');
  const logoutBtn = document.getElementById('logoutBtn');

  const STORAGE_BASE = 'https://dfcgqesfnqamsrzrlhri.supabase.co/storage/v1/object/public/ag-recordings/';

  logoutBtn.addEventListener('click', async function(){
    await supabaseClient.auth.signOut();
    location.href = 'login.html';
  });

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session){
      location.href = 'login.html';
      return;
    }

    const { data: event, error: eventError } = await supabaseClient
      .from('ag_events')
      .select('id, couple_name, slug, created_at, status')
      .eq('owner_id', session.user.id)
      .single();

    if (eventError || !event){
      eventTitle.textContent = 'No event found';
      statusText.className = 'status error';
      statusText.textContent = "We couldn't find a guestbook for this account.";
      return;
    }

    eventTitle.textContent = event.couple_name;
    eventMeta.textContent = 'Created ' + new Date(event.created_at).toLocaleDateString();

    if (event.status !== 'approved'){
      pendingBanner.hidden = false;
    }

    const guestUrl = `${location.origin}${location.pathname.replace('dashboard.html','')}guest.html?event=${event.slug}`;
    guestLinkEl.textContent = guestUrl;
    linkBox.hidden = false;

    copyBtn.addEventListener('click', function(){
      navigator.clipboard.writeText(guestUrl).then(function(){
        copyBtn.textContent = 'Copied!';
        setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 1500);
      });
    });

    const { data: messages, error: messagesError } = await supabaseClient
      .from('ag_messages')
      .select('guest_name, audio_path, message_text, created_at')
      .eq('event_id', event.id)
      .order('created_at', { ascending: false });

    if (messagesError){
      statusText.className = 'status error';
      statusText.textContent = messagesError.message;
      return;
    }

    if (!messages || messages.length === 0){
      statusText.textContent = 'No messages yet — share your guest link to start collecting voice messages.';
      return;
    }

    const voiceMessages = messages.filter(function(m){ return m.audio_path; });
    const textMessages = messages.filter(function(m){ return m.message_text; });

    voiceMessages.forEach(function(m){
      const row = document.createElement('div');
      row.className = 'message-row';

      const who = document.createElement('div');
      who.className = 'message-who';

      const nameEl = document.createElement('span');
      nameEl.className = 'message-guest';
      nameEl.textContent = m.guest_name;

      const timeEl = document.createElement('span');
      timeEl.className = 'message-time';
      timeEl.textContent = new Date(m.created_at).toLocaleString();

      who.appendChild(nameEl);
      who.appendChild(timeEl);

      const audioEl = document.createElement('audio');
      audioEl.controls = true;
      audioEl.src = STORAGE_BASE + m.audio_path;

      row.appendChild(who);
      row.appendChild(audioEl);
      messagesList.appendChild(row);
    });

    if (voiceMessages.length > 0) messagesList.hidden = false;

    if (textMessages.length > 0){
      const grid = document.createElement('div');
      grid.className = 'notes-grid';

      textMessages.forEach(function(m){
        const page = document.createElement('div');
        page.className = 'note-page';

        const quote = document.createElement('p');
        quote.className = 'note-page-quote';
        quote.textContent = m.message_text;

        const time = document.createElement('span');
        time.className = 'note-page-time';
        time.textContent = new Date(m.created_at).toLocaleString();

        const sig = document.createElement('span');
        sig.className = 'note-page-sig';
        sig.textContent = m.guest_name;

        page.appendChild(quote);
        page.appendChild(time);
        page.appendChild(sig);
        grid.appendChild(page);
      });

      notesContainer.appendChild(grid);
      notesContainer.hidden = false;
    }
  }

  init();
})();
</script>

</body>
</html>
