<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Audio Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="topbar">
    <span class="brand">Audio Guestbook</span>
    <button type="button" class="btn-text" id="logoutBtn" style="width:auto;">Log out</button>
  </div>

  <div class="card wide">
    <h1 class="heading" id="eventTitle">Loading…</h1>
    <p class="subtext" id="eventMeta"></p>

    <div class="link-box" id="linkBox" style="margin-bottom:26px;" hidden>
      <span id="guestLink"></span>
      <button type="button" class="btn-text" id="copyBtn">Copy</button>
    </div>

    <p class="status" id="pendingBanner" hidden>Your guestbook is pending admin approval. Guests can't record messages yet — you'll be notified once it's approved.</p>
    <p class="status error" id="frozenBanner" hidden>❄ Your guestbook has been paused by the admin. Guests can't leave new messages right now.</p>
    <p class="status" id="statusText"></p>

    <div class="mode-tabs" id="dashTabs">
      <button type="button" class="mode-tab active" id="voiceTabBtn">🎙 Voice Messages</button>
      <button type="button" class="mode-tab" id="bookTabBtn">📖 Guestbook</button>
    </div>

    <div id="voicePane">
      <div class="message-list" id="voiceList"></div>
      <p class="status" id="voiceEmptyText" hidden>No voice messages yet.</p>
    </div>

    <div id="bookPane" hidden>
      <div class="book-viewer" id="bookViewer">
        <button type="button" class="book-nav" id="prevPageBtn" aria-label="Previous page">‹</button>
        <div class="book-page-frame" id="pageFrame">
          <div class="book-page-layer book-page-back" id="pageBack"></div>
          <div class="book-page-layer book-page-front" id="pageFront"></div>
        </div>
        <button type="button" class="book-nav" id="nextPageBtn" aria-label="Next page">›</button>
      </div>
      <p class="book-page-counter" id="pageCounter"></p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
  const eventTitle = document.getElementById('eventTitle');
  const eventMeta = document.getElementById('eventMeta');
  const linkBox = document.getElementById('linkBox');
  const guestLinkEl = document.getElementById('guestLink');
  const copyBtn = document.getElementById('copyBtn');
  const statusText = document.getElementById('statusText');
  const pendingBanner = document.getElementById('pendingBanner');
  const frozenBanner = document.getElementById('frozenBanner');
  const voiceTabBtn = document.getElementById('voiceTabBtn');
  const bookTabBtn = document.getElementById('bookTabBtn');
  const voicePane = document.getElementById('voicePane');
  const bookPane = document.getElementById('bookPane');
  const voiceList = document.getElementById('voiceList');
  const voiceEmptyText = document.getElementById('voiceEmptyText');
  const bookViewer = document.getElementById('bookViewer');
  const pageBack = document.getElementById('pageBack');
  const pageFront = document.getElementById('pageFront');
  const prevPageBtn = document.getElementById('prevPageBtn');
  const nextPageBtn = document.getElementById('nextPageBtn');
  const pageCounter = document.getElementById('pageCounter');
  const logoutBtn = document.getElementById('logoutBtn');

  const STORAGE_BASE = 'https://dfcgqesfnqamsrzrlhri.supabase.co/storage/v1/object/public/ag-recordings/';
  const COVER_BASE = 'https://dfcgqesfnqamsrzrlhri.supabase.co/storage/v1/object/public/ag-covers/';

  let currentEvent = null;
  let pages = []; // [{ type:'cover' }, { type:'message', data: m }, ...] — written wishes only
  let pageIndex = 0;

  async function deleteMessage(id){
    if (!window.confirm('Delete this message? This can\'t be undone.')) return;
    const { error } = await supabaseClient.from('ag_messages').delete().eq('id', id);
    if (error){
      window.alert('Could not delete: ' + error.message);
      return;
    }
    init();
  }

  logoutBtn.addEventListener('click', async function(){
    await supabaseClient.auth.signOut();
    location.href = 'login.html';
  });

  voiceTabBtn.addEventListener('click', function(){
    voiceTabBtn.classList.add('active');
    bookTabBtn.classList.remove('active');
    voicePane.hidden = false;
    bookPane.hidden = true;
  });
  bookTabBtn.addEventListener('click', function(){
    bookTabBtn.classList.add('active');
    voiceTabBtn.classList.remove('active');
    bookPane.hidden = false;
    voicePane.hidden = true;
  });

  function renderCoverPage(container){
    container.innerHTML = '';

    const cover = document.createElement('div');
    cover.className = 'book-cover-page';

    const inner = document.createElement('div');
    inner.className = 'book-cover-page-inner';

    if (currentEvent.cover_photo_path){
      const img = document.createElement('img');
      img.className = 'book-cover-page-photo';
      img.src = COVER_BASE + currentEvent.cover_photo_path + '?t=' + Date.now();
      img.alt = 'Cover photo';
      inner.appendChild(img);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'book-cover-page-photo-placeholder';
      placeholder.textContent = '📷';
      inner.appendChild(placeholder);
    }

    const title = document.createElement('p');
    title.className = 'book-cover-page-title';
    title.textContent = 'Guest Book';

    const divider = document.createElement('div');
    divider.className = 'book-cover-page-divider';

    const names = document.createElement('p');
    names.className = 'book-cover-page-names';
    names.textContent = currentEvent.couple_name;

    const date = document.createElement('p');
    date.className = 'book-cover-page-date';
    date.textContent = new Date(currentEvent.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

    const uploadWrap = document.createElement('div');
    uploadWrap.className = 'book-cover-page-upload';
    const uploadBtn = document.createElement('button');
    uploadBtn.type = 'button';
    uploadBtn.textContent = currentEvent.cover_photo_path ? 'Change cover photo' : 'Add a cover photo';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.style.display = 'none';

    uploadBtn.addEventListener('click', function(){ fileInput.click(); });

    fileInput.addEventListener('change', async function(){
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.textContent = 'Uploading…';
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${currentEvent.id}/cover.${ext}`;

      const { error: uploadError } = await supabaseClient
        .storage
        .from('ag-covers')
        .upload(path, file, { upsert: true, contentType: file.type });

      if (uploadError){
        window.alert('Could not upload photo: ' + uploadError.message);
        uploadBtn.textContent = 'Add a cover photo';
        return;
      }

      await supabaseClient
        .from('ag_events')
        .update({ cover_photo_path: path })
        .eq('id', currentEvent.id);

      currentEvent.cover_photo_path = path;
      renderCoverPage(pageFront);
      renderCoverPage(pageBack);
    });

    uploadWrap.appendChild(uploadBtn);
    uploadWrap.appendChild(fileInput);

    inner.appendChild(title);
    inner.appendChild(divider);
    inner.appendChild(names);
    inner.appendChild(date);
    inner.appendChild(uploadWrap);
    cover.appendChild(inner);
    container.appendChild(cover);
  }

  function renderMessagePage(container, m){
    container.innerHTML = '';

    const spread = document.createElement('div');
    spread.className = 'book-spread';

    const left = document.createElement('div');
    left.className = 'book-spread-left';
    const mark = document.createElement('span');
    mark.className = 'book-spread-left-mark';
    mark.textContent = '“ ”';
    left.appendChild(mark);

    const right = document.createElement('div');
    right.className = 'book-spread-right';

    const quote = document.createElement('p');
    quote.className = 'book-page-quote';
    quote.textContent = m.message_text;

    const sig = document.createElement('p');
    sig.className = 'book-page-sig';
    sig.textContent = m.guest_name;

    const time = document.createElement('span');
    time.className = 'book-page-time';
    time.textContent = new Date(m.created_at).toLocaleString();

    right.appendChild(quote);
    right.appendChild(sig);
    right.appendChild(time);

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'btn-text';
    deleteBtn.style.width = 'auto';
    deleteBtn.style.fontSize = '0.75rem';
    deleteBtn.style.color = 'var(--danger)';
    deleteBtn.style.marginTop = '4px';
    deleteBtn.textContent = 'Delete this message';
    deleteBtn.addEventListener('click', function(){ deleteMessage(m.id); });
    right.appendChild(deleteBtn);

    spread.appendChild(left);
    spread.appendChild(right);
    container.appendChild(spread);
  }

  function renderEmptyMessagesPage(container){
    container.innerHTML = '';

    const spread = document.createElement('div');
    spread.className = 'book-spread';

    const left = document.createElement('div');
    left.className = 'book-spread-left';
    const mark = document.createElement('span');
    mark.className = 'book-spread-left-mark';
    mark.textContent = '“ ”';
    left.appendChild(mark);

    const right = document.createElement('div');
    right.className = 'book-spread-right';
    const p = document.createElement('p');
    p.className = 'subtext';
    p.style.margin = '0';
    p.textContent = 'No written wishes yet — share your guest link to start collecting them.';
    right.appendChild(p);

    spread.appendChild(left);
    spread.appendChild(right);
    container.appendChild(spread);
  }

  function fillLayer(container, page){
    if (page.type === 'cover'){
      renderCoverPage(container);
    } else if (page.type === 'empty'){
      renderEmptyMessagesPage(container);
    } else {
      renderMessagePage(container, page.data);
    }
  }

  function updateChrome(){
    prevPageBtn.disabled = pageIndex === 0;
    nextPageBtn.disabled = pageIndex === pages.length - 1;
    pageCounter.textContent = `~ ${pageIndex + 1} of ${pages.length} ~`;
  }

  let flipping = false;

  function goToPage(newIndex, direction){
    if (flipping || newIndex < 0 || newIndex >= pages.length) return;
    flipping = true;

    fillLayer(pageBack, pages[newIndex]);

    pageFront.style.transition = 'none';
    pageFront.classList.remove('flipping-next', 'flipping-prev');
    void pageFront.offsetWidth;
    pageFront.style.transition = '';

    requestAnimationFrame(function(){
      pageFront.classList.add(direction === 'prev' ? 'flipping-prev' : 'flipping-next');
    });

    pageFront.addEventListener('transitionend', function handler(e){
      if (e.propertyName !== 'transform') return;
      pageFront.removeEventListener('transitionend', handler);

      pageFront.style.transition = 'none';
      pageFront.classList.remove('flipping-next', 'flipping-prev');
      fillLayer(pageFront, pages[newIndex]);
      void pageFront.offsetWidth;
      pageFront.style.transition = '';

      pageIndex = newIndex;
      updateChrome();
      flipping = false;
    }, { once: true });
  }

  prevPageBtn.addEventListener('click', function(){
    goToPage(pageIndex - 1, 'prev');
  });
  nextPageBtn.addEventListener('click', function(){
    goToPage(pageIndex + 1, 'next');
  });

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session){
      location.href = 'login.html';
      return;
    }

    const { data: event, error: eventError } = await supabaseClient
      .from('ag_events')
      .select('id, couple_name, slug, created_at, status, frozen, cover_photo_path')
      .eq('owner_id', session.user.id)
      .single();

    if (eventError || !event){
      eventTitle.textContent = 'No event found';
      statusText.className = 'status error';
      statusText.textContent = "We couldn't find a guestbook for this account.";
      return;
    }

    currentEvent = event;
    eventTitle.textContent = event.couple_name;
    eventMeta.textContent = 'Created ' + new Date(event.created_at).toLocaleDateString();

    if (event.status !== 'approved'){
      pendingBanner.hidden = false;
    }
    if (event.frozen){
      frozenBanner.hidden = false;
    }

    const guestUrl = `${location.origin}${location.pathname.replace('dashboard.html','')}guest.html?event=${event.slug}`;
    guestLinkEl.textContent = guestUrl;
    linkBox.hidden = false;

    copyBtn.addEventListener('click', function(){
      navigator.clipboard.writeText(guestUrl).then(function(){
        copyBtn.textContent = 'Copied!';
        setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 1500);
      });
    });

    const { data: messages, error: messagesError } = await supabaseClient
      .from('ag_messages')
      .select('id, guest_name, audio_path, message_text, created_at')
      .eq('event_id', event.id)
      .order('created_at', { ascending: false });

    if (messagesError){
      statusText.className = 'status error';
      statusText.textContent = messagesError.message;
      return;
    }

    pages = [{ type: 'cover' }];
    const voiceMessages = (messages || []).filter(function(m){ return m.audio_path; });
    const textMessages = (messages || []).filter(function(m){ return m.message_text; });

    if (voiceMessages.length > 0){
      voiceMessages.forEach(function(m){
        const row = document.createElement('div');
        row.className = 'message-row';

        const who = document.createElement('div');
        who.className = 'message-who';

        const nameEl = document.createElement('span');
        nameEl.className = 'message-guest';
        nameEl.textContent = m.guest_name;

        const timeEl = document.createElement('span');
        timeEl.className = 'message-time';
        timeEl.textContent = new Date(m.created_at).toLocaleString();

        who.appendChild(nameEl);
        who.appendChild(timeEl);

        const audioEl = document.createElement('audio');
        audioEl.controls = true;
        audioEl.src = STORAGE_BASE + m.audio_path;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'btn-text';
        deleteBtn.style.width = 'auto';
        deleteBtn.style.fontSize = '0.78rem';
        deleteBtn.style.color = 'var(--danger)';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', function(){ deleteMessage(m.id); });

        row.appendChild(who);
        row.appendChild(audioEl);
        row.appendChild(deleteBtn);
        voiceList.appendChild(row);
      });
    } else {
      voiceEmptyText.hidden = false;
    }

    if (textMessages.length > 0){
      textMessages.forEach(function(m){ pages.push({ type: 'message', data: m }); });
    } else {
      pages.push({ type: 'empty' });
    }

    pageIndex = 0;
    fillLayer(pageBack, pages[0]);
    fillLayer(pageFront, pages[0]);
    updateChrome();
  }

  init();
})();
</script>

</body>
</html>
