<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Audio Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="topbar">
    <span class="brand">Audio Guestbook — Admin</span>
    <button type="button" class="btn-text" id="logoutBtn" style="width:auto;">Log out</button>
  </div>

  <div class="card wide">
    <h1 class="heading">All clients</h1>
    <p class="subtext" id="summaryText"></p>
    <p class="status" id="statusText"></p>
    <div id="eventsContainer"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
  const summaryText = document.getElementById('summaryText');
  const statusText = document.getElementById('statusText');
  const eventsContainer = document.getElementById('eventsContainer');
  const logoutBtn = document.getElementById('logoutBtn');

  const STORAGE_BASE = 'https://dfcgqesfnqamsrzrlhri.supabase.co/storage/v1/object/public/ag-recordings/';

  logoutBtn.addEventListener('click', async function(){
    await supabaseClient.auth.signOut();
    location.href = 'login.html';
  });

  async function setStatus(eventId, newStatus){
    const { error } = await supabaseClient
      .from('ag_events')
      .update({ status: newStatus })
      .eq('id', eventId);

    if (error){
      window.alert('Could not update status: ' + error.message);
      return;
    }

    init();
  }

  async function init(){
    eventsContainer.innerHTML = '';
    statusText.textContent = '';
    statusText.className = 'status';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session){
      location.href = 'login.html';
      return;
    }

    const { data: adminRow } = await supabaseClient
      .from('ag_admins')
      .select('user_id')
      .eq('user_id', session.user.id)
      .maybeSingle();

    if (!adminRow){
      statusText.className = 'status error';
      statusText.textContent = "This account doesn't have admin access.";
      return;
    }

    const { data: events, error: eventsError } = await supabaseClient
      .from('ag_events')
      .select('id, couple_name, slug, created_at, status')
      .order('created_at', { ascending: false });

    if (eventsError){
      statusText.className = 'status error';
      statusText.textContent = eventsError.message;
      return;
    }

    if (!events || events.length === 0){
      summaryText.textContent = 'No clients yet.';
      return;
    }

    const pendingCount = events.filter(function(ev){ return ev.status === 'pending'; }).length;
    summaryText.textContent = `${events.length} client${events.length === 1 ? '' : 's'}` +
      (pendingCount > 0 ? ` · ${pendingCount} awaiting approval` : '');

    const { data: allMessages, error: messagesError } = await supabaseClient
      .from('ag_messages')
      .select('event_id, guest_name, audio_path, message_text, created_at')
      .order('created_at', { ascending: false });

    if (messagesError){
      statusText.className = 'status error';
      statusText.textContent = messagesError.message;
      return;
    }

    const messagesByEvent = {};
    (allMessages || []).forEach(function(m){
      if (!messagesByEvent[m.event_id]) messagesByEvent[m.event_id] = [];
      messagesByEvent[m.event_id].push(m);
    });

    events.forEach(function(ev){
      const card = document.createElement('div');
      card.className = 'client-card';

      const header = document.createElement('div');
      header.className = 'client-card-header';

      const title = document.createElement('p');
      title.className = 'client-card-title';
      title.textContent = ev.couple_name;

      const badge = document.createElement('span');
      badge.className = 'status-pill ' + ev.status;
      badge.textContent = ev.status;

      header.appendChild(title);
      header.appendChild(badge);

      const meta = document.createElement('p');
      meta.className = 'client-card-meta';
      const msgs = messagesByEvent[ev.id] || [];
      meta.textContent = `/${ev.slug} · ${msgs.length} message${msgs.length === 1 ? '' : 's'} · created ${new Date(ev.created_at).toLocaleDateString()}`;

      const actions = document.createElement('div');
      actions.className = 'client-actions';

      if (ev.status !== 'approved'){
        const approveBtn = document.createElement('button');
        approveBtn.type = 'button';
        approveBtn.className = 'action-btn approve';
        approveBtn.textContent = 'Approve';
        approveBtn.addEventListener('click', function(){ setStatus(ev.id, 'approved'); });
        actions.appendChild(approveBtn);
      }

      if (ev.status !== 'rejected'){
        const rejectBtn = document.createElement('button');
        rejectBtn.type = 'button';
        rejectBtn.className = 'action-btn reject';
        rejectBtn.textContent = 'Reject';
        rejectBtn.addEventListener('click', function(){ setStatus(ev.id, 'rejected'); });
        actions.appendChild(rejectBtn);
      }

      card.appendChild(header);
      card.appendChild(meta);
      card.appendChild(actions);

      const voiceMessages = msgs.filter(function(m){ return m.audio_path; });
      const textMessages = msgs.filter(function(m){ return m.message_text; });

      if (voiceMessages.length > 0){
        const list = document.createElement('div');
        list.className = 'message-list';

        voiceMessages.forEach(function(m){
          const row = document.createElement('div');
          row.className = 'message-row';

          const who = document.createElement('div');
          who.className = 'message-who';

          const nameEl = document.createElement('span');
          nameEl.className = 'message-guest';
          nameEl.textContent = m.guest_name;

          const timeEl = document.createElement('span');
          timeEl.className = 'message-time';
          timeEl.textContent = new Date(m.created_at).toLocaleString();

          who.appendChild(nameEl);
          who.appendChild(timeEl);

          const audioEl = document.createElement('audio');
          audioEl.controls = true;
          audioEl.src = STORAGE_BASE + m.audio_path;

          row.appendChild(who);
          row.appendChild(audioEl);
          list.appendChild(row);
        });

        card.appendChild(list);
      }

      if (textMessages.length > 0){
        const grid = document.createElement('div');
        grid.className = 'notes-grid';

        textMessages.forEach(function(m){
          const page = document.createElement('div');
          page.className = 'note-page';

          const quote = document.createElement('p');
          quote.className = 'note-page-quote';
          quote.textContent = m.message_text;

          const time = document.createElement('span');
          time.className = 'note-page-time';
          time.textContent = new Date(m.created_at).toLocaleString();

          const sig = document.createElement('span');
          sig.className = 'note-page-sig';
          sig.textContent = m.guest_name;

          page.appendChild(quote);
          page.appendChild(time);
          page.appendChild(sig);
          grid.appendChild(page);
        });

        card.appendChild(grid);
      }

      eventsContainer.appendChild(card);
    });
  }

  init();
})();
</script>

</body>
</html>
