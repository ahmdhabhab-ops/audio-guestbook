<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Audio Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="topbar">
    <span class="brand">Audio Guestbook — Admin</span>
    <button type="button" class="btn-text" id="logoutBtn" style="width:auto;">Log out</button>
  </div>

  <div class="card wide" id="adminsCard" hidden>
    <h1 class="heading" style="font-size:1.3rem;">Admins</h1>
    <p class="subtext" id="adminsList" style="margin-bottom:16px;">Loading…</p>

    <form id="addAdminForm" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
      <div class="field" style="flex:1; min-width:220px; margin-bottom:0;">
        <label class="field-label" for="newAdminEmail">Add admin by email</label>
        <input type="email" id="newAdminEmail" class="field-input" placeholder="colleague@email.com" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:auto; padding:11px 20px;">Add</button>
    </form>
    <p class="status" id="addAdminStatus"></p>
  </div>

  <div class="card wide">
    <h1 class="heading">All clients</h1>
    <p class="subtext" id="summaryText"></p>
    <p class="status" id="statusText"></p>
    <div id="eventsContainer"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
  const summaryText = document.getElementById('summaryText');
  const statusText = document.getElementById('statusText');
  const eventsContainer = document.getElementById('eventsContainer');
  const logoutBtn = document.getElementById('logoutBtn');

  const adminsCard = document.getElementById('adminsCard');
  const adminsList = document.getElementById('adminsList');
  const addAdminForm = document.getElementById('addAdminForm');
  const newAdminEmail = document.getElementById('newAdminEmail');
  const addAdminStatus = document.getElementById('addAdminStatus');

  const STORAGE_BASE = 'https://dfcgqesfnqamsrzrlhri.supabase.co/storage/v1/object/public/ag-recordings/';
  const COVER_BASE = 'https://dfcgqesfnqamsrzrlhri.supabase.co/storage/v1/object/public/ag-recordings/';

  logoutBtn.addEventListener('click', async function(){
    await supabaseClient.auth.signOut();
    location.href = 'login.html';
  });

  async function loadAdmins(currentUserId){
    const { data, error } = await supabaseClient.rpc('list_admins');

    if (error){
      adminsList.textContent = error.message;
      return;
    }

    adminsList.innerHTML = '';
    (data || []).forEach(function(a, i){
      if (i > 0) adminsList.appendChild(document.createTextNode(' · '));
      const span = document.createElement('span');
      span.textContent = a.email + (a.user_id === currentUserId ? ' (you)' : '');
      adminsList.appendChild(span);

      if (a.user_id !== currentUserId){
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn-text';
        removeBtn.style.width = 'auto';
        removeBtn.style.padding = '0 0 0 4px';
        removeBtn.style.fontSize = '0.8rem';
        removeBtn.textContent = 'remove';
        removeBtn.addEventListener('click', async function(){
          const { error: removeError } = await supabaseClient.rpc('remove_admin', { target_user_id: a.user_id });
          if (removeError){
            window.alert('Could not remove admin: ' + removeError.message);
            return;
          }
          loadAdmins(currentUserId);
        });
        adminsList.appendChild(removeBtn);
      }
    });

    if (!data || data.length === 0){
      adminsList.textContent = 'No admins found.';
    }
  }

  addAdminForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = newAdminEmail.value.trim();
    if (!email) return;

    addAdminStatus.className = 'status';
    addAdminStatus.textContent = 'Adding…';

    const { data: { session } } = await supabaseClient.auth.getSession();
    const { error } = await supabaseClient.rpc('add_admin_by_email', { target_email: email });

    if (error){
      addAdminStatus.className = 'status error';
      addAdminStatus.textContent = error.message;
      return;
    }

    addAdminStatus.className = 'status success';
    addAdminStatus.textContent = `${email} is now an admin.`;
    newAdminEmail.value = '';
    if (session) loadAdmins(session.user.id);
  });

  async function setStatus(eventId, newStatus){
    const { error } = await supabaseClient
      .from('ag_events')
      .update({ status: newStatus })
      .eq('id', eventId);

    if (error){
      window.alert('Could not update status: ' + error.message);
      return;
    }

    init();
  }

  async function setFrozen(eventId, frozen){
    const { error } = await supabaseClient
      .from('ag_events')
      .update({ frozen: frozen })
      .eq('id', eventId);

    if (error){
      window.alert('Could not update: ' + error.message);
      return;
    }

    init();
  }

  async function deleteEvent(eventId, coupleName){
    if (!window.confirm(`Delete "${coupleName}" and all of their messages? This can't be undone.`)) return;

    const { error } = await supabaseClient
      .from('ag_events')
      .delete()
      .eq('id', eventId);

    if (error){
      window.alert('Could not delete: ' + error.message);
      return;
    }

    init();
  }

  function renderCoverLayer(container, ev){
    container.innerHTML = '';
    const cover = document.createElement('div');
    cover.className = 'book-cover-page';
    const inner = document.createElement('div');
    inner.className = 'book-cover-page-inner';

    if (ev.cover_photo_path){
      const img = document.createElement('img');
      img.className = 'book-cover-page-photo';
      img.src = COVER_BASE + ev.cover_photo_path;
      img.alt = 'Cover photo';
      inner.appendChild(img);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'book-cover-page-photo-placeholder';
      placeholder.textContent = '📷';
      inner.appendChild(placeholder);
    }

    const title = document.createElement('p');
    title.className = 'book-cover-page-title';
    title.textContent = 'Guest Book';

    const divider = document.createElement('div');
    divider.className = 'book-cover-page-divider';

    const names = document.createElement('p');
    names.className = 'book-cover-page-names';
    names.textContent = ev.couple_name;

    const date = document.createElement('p');
    date.className = 'book-cover-page-date';
    date.textContent = new Date(ev.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

    inner.appendChild(title);
    inner.appendChild(divider);
    inner.appendChild(names);
    inner.appendChild(date);
    cover.appendChild(inner);
    container.appendChild(cover);
  }

  function renderMessageLayer(container, m){
    container.innerHTML = '';
    const spread = document.createElement('div');
    spread.className = 'book-spread';

    const left = document.createElement('div');
    left.className = 'book-spread-left';
    const mark = document.createElement('span');
    mark.className = 'book-spread-left-mark';
    mark.textContent = '“ ”';
    left.appendChild(mark);

    const right = document.createElement('div');
    right.className = 'book-spread-right';

    const quote = document.createElement('p');
    quote.className = 'book-page-quote';
    quote.textContent = m.message_text;

    const sig = document.createElement('p');
    sig.className = 'book-page-sig';
    sig.textContent = m.guest_name;

    const time = document.createElement('span');
    time.className = 'book-page-time';
    time.textContent = new Date(m.created_at).toLocaleString();

    right.appendChild(quote);
    right.appendChild(sig);
    right.appendChild(time);
    spread.appendChild(left);
    spread.appendChild(right);
    container.appendChild(spread);
  }

  function renderEmptyLayer(container, text){
    container.innerHTML = '';
    const spread = document.createElement('div');
    spread.className = 'book-spread';

    const left = document.createElement('div');
    left.className = 'book-spread-left';
    const mark = document.createElement('span');
    mark.className = 'book-spread-left-mark';
    mark.textContent = '“ ”';
    left.appendChild(mark);

    const right = document.createElement('div');
    right.className = 'book-spread-right';
    const p = document.createElement('p');
    p.className = 'subtext';
    p.style.margin = '0';
    p.textContent = text;
    right.appendChild(p);

    spread.appendChild(left);
    spread.appendChild(right);
    container.appendChild(spread);
  }

  function buildBookWidget(ev, textMessages){
    const pages = [{ type: 'cover' }];
    if (textMessages.length > 0){
      textMessages.forEach(function(m){ pages.push({ type: 'message', data: m }); });
    } else {
      pages.push({ type: 'empty' });
    }

    const wrap = document.createElement('div');

    const viewer = document.createElement('div');
    viewer.className = 'book-viewer';

    const prevBtn = document.createElement('button');
    prevBtn.type = 'button';
    prevBtn.className = 'book-nav';
    prevBtn.setAttribute('aria-label', 'Previous page');
    prevBtn.textContent = '‹';

    const frame = document.createElement('div');
    frame.className = 'book-page-frame';
    const back = document.createElement('div');
    back.className = 'book-page-layer book-page-back';
    const front = document.createElement('div');
    front.className = 'book-page-layer book-page-front';
    frame.appendChild(back);
    frame.appendChild(front);

    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.className = 'book-nav';
    nextBtn.setAttribute('aria-label', 'Next page');
    nextBtn.textContent = '›';

    viewer.appendChild(prevBtn);
    viewer.appendChild(frame);
    viewer.appendChild(nextBtn);

    const counter = document.createElement('p');
    counter.className = 'book-page-counter';

    wrap.appendChild(viewer);
    wrap.appendChild(counter);

    let pageIndex = 0;
    let flipping = false;

    function fillLayer(container, page){
      if (page.type === 'cover') renderCoverLayer(container, ev);
      else if (page.type === 'empty') renderEmptyLayer(container, 'No written wishes yet.');
      else renderMessageLayer(container, page.data);
    }

    function updateChrome(){
      prevBtn.disabled = pageIndex === 0;
      nextBtn.disabled = pageIndex === pages.length - 1;
      counter.textContent = `~ ${pageIndex + 1} of ${pages.length} ~`;
    }

    function goToPage(newIndex, direction){
      if (flipping || newIndex < 0 || newIndex >= pages.length) return;
      flipping = true;

      fillLayer(back, pages[newIndex]);

      front.style.transition = 'none';
      front.classList.remove('flipping-next', 'flipping-prev');
      void front.offsetWidth;
      front.style.transition = '';

      requestAnimationFrame(function(){
        front.classList.add(direction === 'prev' ? 'flipping-prev' : 'flipping-next');
      });

      front.addEventListener('transitionend', function handler(e){
        if (e.propertyName !== 'transform') return;
        front.removeEventListener('transitionend', handler);

        front.style.transition = 'none';
        front.classList.remove('flipping-next', 'flipping-prev');
        fillLayer(front, pages[newIndex]);
        void front.offsetWidth;
        front.style.transition = '';

        pageIndex = newIndex;
        updateChrome();
        flipping = false;
      }, { once: true });
    }

    prevBtn.addEventListener('click', function(){ goToPage(pageIndex - 1, 'prev'); });
    nextBtn.addEventListener('click', function(){ goToPage(pageIndex + 1, 'next'); });

    fillLayer(back, pages[0]);
    fillLayer(front, pages[0]);
    updateChrome();

    return wrap;
  }

  async function init(){
    eventsContainer.innerHTML = '';
    statusText.textContent = '';
    statusText.className = 'status';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session){
      location.href = 'login.html';
      return;
    }

    const { data: adminRow } = await supabaseClient
      .from('ag_admins')
      .select('user_id')
      .eq('user_id', session.user.id)
      .maybeSingle();

    if (!adminRow){
      statusText.className = 'status error';
      statusText.textContent = "This account doesn't have admin access.";
      return;
    }

    adminsCard.hidden = false;
    loadAdmins(session.user.id);

    const { data: events, error: eventsError } = await supabaseClient.rpc('list_events_for_admin');

    if (eventsError){
      statusText.className = 'status error';
      statusText.textContent = eventsError.message;
      return;
    }

    if (!events || events.length === 0){
      summaryText.textContent = 'No clients yet.';
      return;
    }

    const pendingCount = events.filter(function(ev){ return ev.status === 'pending'; }).length;
    summaryText.textContent = `${events.length} client${events.length === 1 ? '' : 's'}` +
      (pendingCount > 0 ? ` · ${pendingCount} awaiting approval` : '');

    const { data: allMessages, error: messagesError } = await supabaseClient
      .from('ag_messages')
      .select('event_id, guest_name, audio_path, message_text, created_at')
      .order('created_at', { ascending: false });

    if (messagesError){
      statusText.className = 'status error';
      statusText.textContent = messagesError.message;
      return;
    }

    const messagesByEvent = {};
    (allMessages || []).forEach(function(m){
      if (!messagesByEvent[m.event_id]) messagesByEvent[m.event_id] = [];
      messagesByEvent[m.event_id].push(m);
    });

    events.forEach(function(ev){
      const card = document.createElement('div');
      card.className = 'client-card';

      const header = document.createElement('div');
      header.className = 'client-card-header';

      const title = document.createElement('p');
      title.className = 'client-card-title';
      title.textContent = ev.couple_name;

      const badge = document.createElement('span');
      badge.className = 'status-pill ' + ev.status;
      badge.textContent = ev.status;

      header.appendChild(title);
      header.appendChild(badge);

      if (ev.frozen){
        const frozenBadge = document.createElement('span');
        frozenBadge.className = 'status-pill rejected';
        frozenBadge.textContent = '❄ frozen';
        header.appendChild(frozenBadge);
      }

      const msgs = messagesByEvent[ev.id] || [];
      const voiceMessages = msgs.filter(function(m){ return m.audio_path; });
      const textMessages = msgs.filter(function(m){ return m.message_text; });

      const meta = document.createElement('p');
      meta.className = 'client-card-meta';
      meta.textContent = `${ev.owner_email} · /${ev.slug} · ${msgs.length} message${msgs.length === 1 ? '' : 's'} · created ${new Date(ev.created_at).toLocaleDateString()}`;

      const actions = document.createElement('div');
      actions.className = 'client-actions';

      if (ev.status !== 'approved'){
        const approveBtn = document.createElement('button');
        approveBtn.type = 'button';
        approveBtn.className = 'action-btn approve';
        approveBtn.textContent = 'Approve';
        approveBtn.addEventListener('click', function(){ setStatus(ev.id, 'approved'); });
        actions.appendChild(approveBtn);
      }

      if (ev.status !== 'rejected'){
        const rejectBtn = document.createElement('button');
        rejectBtn.type = 'button';
        rejectBtn.className = 'action-btn reject';
        rejectBtn.textContent = 'Reject';
        rejectBtn.addEventListener('click', function(){ setStatus(ev.id, 'rejected'); });
        actions.appendChild(rejectBtn);
      }

      const freezeBtn = document.createElement('button');
      freezeBtn.type = 'button';
      freezeBtn.className = 'action-btn reject';
      freezeBtn.textContent = ev.frozen ? 'Unfreeze' : 'Freeze';
      freezeBtn.addEventListener('click', function(){ setFrozen(ev.id, !ev.frozen); });
      actions.appendChild(freezeBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'action-btn reject';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', function(){ deleteEvent(ev.id, ev.couple_name); });
      actions.appendChild(deleteBtn);

      card.appendChild(header);
      card.appendChild(meta);
      card.appendChild(actions);

      // Tabs: Voice Messages / Guestbook
      const tabs = document.createElement('div');
      tabs.className = 'mode-tabs';
      const voiceTab = document.createElement('button');
      voiceTab.type = 'button';
      voiceTab.className = 'mode-tab active';
      voiceTab.textContent = '🎙 Voice Messages';
      const bookTab = document.createElement('button');
      bookTab.type = 'button';
      bookTab.className = 'mode-tab';
      bookTab.textContent = '📖 Guestbook';
      tabs.appendChild(voiceTab);
      tabs.appendChild(bookTab);

      const voicePane = document.createElement('div');
      const voiceList = document.createElement('div');
      voiceList.className = 'message-list';

      if (voiceMessages.length > 0){
        voiceMessages.forEach(function(m){
          const row = document.createElement('div');
          row.className = 'message-row';

          const who = document.createElement('div');
          who.className = 'message-who';
          const nameEl = document.createElement('span');
          nameEl.className = 'message-guest';
          nameEl.textContent = m.guest_name;
          const timeEl = document.createElement('span');
          timeEl.className = 'message-time';
          timeEl.textContent = new Date(m.created_at).toLocaleString();
          who.appendChild(nameEl);
          who.appendChild(timeEl);

          const audioEl = document.createElement('audio');
          audioEl.controls = true;
          audioEl.src = STORAGE_BASE + m.audio_path;

          row.appendChild(who);
          row.appendChild(audioEl);
          voiceList.appendChild(row);
        });
      } else {
        const emptyText = document.createElement('p');
        emptyText.className = 'status';
        emptyText.textContent = 'No voice messages yet.';
        voiceList.appendChild(emptyText);
      }
      voicePane.appendChild(voiceList);

      const bookPane = document.createElement('div');
      bookPane.hidden = true;
      bookPane.appendChild(buildBookWidget(ev, textMessages));

      voiceTab.addEventListener('click', function(){
        voiceTab.classList.add('active');
        bookTab.classList.remove('active');
        voicePane.hidden = false;
        bookPane.hidden = true;
      });
      bookTab.addEventListener('click', function(){
        bookTab.classList.add('active');
        voiceTab.classList.remove('active');
        bookPane.hidden = false;
        voicePane.hidden = true;
      });

      card.appendChild(tabs);
      card.appendChild(voicePane);
      card.appendChild(bookPane);

      eventsContainer.appendChild(card);
    });
  }

  init();
})();
</script>

</body>
</html>
