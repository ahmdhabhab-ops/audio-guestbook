<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory: #FBF7F2; --card: #FFFFFF; --ink: #2C2430; --plum: #6B4E71; --plum-deep: #4C3549;
    --mauve-soft: #EFE3EC; --gold: #B98B4E; --gold-soft: #E9D9BC; --line: #E7DEE2;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:'Manrope', sans-serif; color: var(--ink);
    background: radial-gradient(circle at 50% -10%, #FDFAF7 0%, var(--ivory) 45%, #F6EEF4 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 32px 16px;
  }
  .card{
    width:100%; max-width:440px; background: var(--card); border: 1px solid var(--line);
    border-radius: 28px; box-shadow: 0 24px 60px rgba(76, 53, 73, 0.10); padding: 48px 36px 40px; text-align:center;
  }
  .badge{
    width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 50%;
    border: 1.5px dashed var(--gold-soft); display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .badge::before{ content:""; position:absolute; inset: 6px; border-radius:50%; border: 1px dashed var(--line); }
  .badge svg{ width:26px; height:26px; position:relative; z-index:1; opacity:0.55; }
  .badge-caption{ font-size: 0.68rem; letter-spacing: 0.06em; color: var(--ink); opacity: 0.4; margin: 0 0 24px; }
  h1.heading{
    font-family:'Fraunces', serif; font-weight:400; font-style:italic;
    font-size: clamp(1rem, 2.6vw, 1.15rem); color: var(--ink); margin: 0; letter-spacing: 0.01em;
  }
  .event-name{
    font-family:'Fraunces', serif; font-weight:600; font-style:normal;
    font-size: clamp(1.7rem, 5vw, 2.35rem); color: var(--plum-deep); margin: 6px 0 0; line-height:1.15;
  }
  .ornament{ width: 64px; margin: 18px auto 20px; display:block; }
  .ornament svg{ width:100%; height:auto; display:block; }
  .subtext{ font-size: 0.95rem; line-height:1.55; color: var(--ink); opacity: 0.62; max-width: 30ch; margin: 0 auto; }
  .field{ text-align:left; max-width: 280px; margin: 30px auto 0; }
  .field-label{ display:block; font-size: 0.78rem; color: var(--ink); opacity: 0.6; margin-bottom: 6px; }
  .field-input{
    width:100%; font-family:'Manrope', sans-serif; font-size: 0.95rem; padding: 11px 14px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--ivory); color: var(--ink);
    outline:none; transition: border-color .2s ease;
  }
  .field-input:focus{ border-color: var(--plum); }
  .recorder{
    position:relative; display:flex; flex-direction:column; align-items:center;
    margin: 36px 0 8px; height: 168px; justify-content:center;
  }
  .rings{ position:absolute; top:50%; left:50%; width:120px; height:120px; transform: translate(-50%,-52%); pointer-events:none; }
  .rings span{ position:absolute; inset:0; border-radius:50%; border: 1px solid var(--mauve-soft); opacity:0; }
  .recorder.recording .rings span{ animation: pulse 2.2s ease-out infinite; }
  .recorder.recording .rings span:nth-child(2){ animation-delay: 0.7s; }
  @keyframes pulse{ 0%{ transform: scale(1); opacity: 0.55; } 100%{ transform: scale(1.7); opacity: 0; } }
  .mic-circle{
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(160deg, var(--plum), var(--plum-deep)); display:flex; align-items:center; justify-content:center;
    box-shadow: 0 14px 30px rgba(107, 78, 113, 0.32); position:relative; z-index:1;
    transition: box-shadow .3s ease, background .3s ease;
  }
  .recorder.recording .mic-circle{
    background: linear-gradient(160deg, #7A5A80, var(--plum-deep)); box-shadow: 0 14px 34px rgba(107, 78, 113, 0.44);
  }
  .mic-circle svg{ width:40px; height:40px; }
  .timer{
    margin-top: 16px; font-variant-numeric: tabular-nums; font-size: 0.9rem; font-weight: 600;
    letter-spacing: 0.03em; color: var(--ink); opacity: 0.65;
  }
  .controls{ display:flex; gap: 12px; justify-content:center; flex-wrap: wrap; margin-top: 8px; }
  .btn{
    font-family:'Manrope', sans-serif; font-weight:600; font-size: 0.95rem; border-radius: 999px; padding: 14px 24px;
    display:inline-flex; align-items:center; gap: 9px; cursor:pointer; border: 1px solid transparent;
    transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn svg{ width:17px; height:17px; flex-shrink:0; }
  .btn-primary{ background: var(--plum); color: #fff; }
  .btn-primary:hover:not(:disabled){ background: var(--plum-deep); transform: translateY(-1px); }
  .btn-outline{ background: transparent; color: var(--plum-deep); border-color: var(--gold); }
  .btn-outline:hover:not(:disabled){ background: var(--gold-soft); }
  .btn:disabled{ background: var(--line); border-color: var(--line); color: #9C919E; cursor: not-allowed; transform:none; }
  .btn-text{
    background:none; border:none; color: var(--plum-deep); text-decoration: underline;
    text-underline-offset: 3px; font-size: 0.88rem; padding: 6px;
  }
  .status{ margin-top: 20px; font-size: 0.85rem; color: var(--ink); opacity: 0.55; min-height: 1.2em; }
  .status.error{ color:#B4534B; opacity:1; }
  .playback{
    margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; gap: 12px;
  }
  .playback-label{ font-size: 0.8rem; color: var(--ink); opacity: 0.55; margin:0; }
  audio{ width: 100%; max-width: 300px; }
  *:focus-visible{ outline: 2px solid var(--plum); outline-offset: 3px; border-radius: 4px; }
  @media (max-width: 420px){
    .card{ padding: 40px 22px 32px; }
    .mic-circle{ width:104px; height:104px; }
    .rings{ width:104px; height:104px; }
    .controls{ flex-direction:column; align-items:stretch; }
    .btn{ justify-content:center; }
  }
  @media (prefers-reduced-motion: reduce){
    .recorder.recording .rings span{ animation:none; opacity:0.4; }
    .btn{ transition:none; }
  }
</style>
</head>
<body>

  <main class="card" id="card">

    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#B98B4E" stroke-width="1.4">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9.5" r="1.5"/>
        <path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L3 20"/>
      </svg>
    </div>
    <p class="badge-caption">company logo</p>

    <h1 class="heading">Record a voice message to</h1>
    <p class="event-name" id="eventName">Loading…</p>

    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 64 8" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="4" x2="26" y2="4" stroke="#B98B4E" stroke-width="1"/>
        <circle cx="32" cy="4" r="2.5" fill="#B98B4E"/>
        <line x1="38" y1="4" x2="64" y2="4" stroke="#B98B4E" stroke-width="1"/>
      </svg>
    </div>

    <p class="subtext">Share a memory, a wish, or just say hello — this one will be listened back to for years to come.</p>

    <div class="field">
      <label for="guestName" class="field-label">Your name</label>
      <input type="text" id="guestName" class="field-input" placeholder="e.g. Karim" autocomplete="name">
    </div>

    <div class="recorder" id="recorder">
      <div class="rings" aria-hidden="true"><span></span><span></span></div>
      <div class="mic-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M6.5 11.5V12a5.5 5.5 0 0 0 11 0v-.5"/>
          <path d="M12 17.5V21"/>
        </svg>
      </div>
      <div class="timer" id="timer" aria-live="polite">00:00</div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M6.5 11.5V12a5.5 5.5 0 0 0 11 0v-.5"/>
          <path d="M12 17.5V21"/>
        </svg>
        Start Recording
      </button>
      <button id="stopBtn" class="btn btn-outline" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        Stop Recording
      </button>
    </div>

    <p class="status" id="statusText" aria-live="polite">Loading this guestbook…</p>

    <div class="playback" id="playback" hidden>
      <p class="playback-label">Your message</p>
      <audio id="audioPlayback" controls></audio>
      <button id="rerecordBtn" class="btn btn-text" type="button">Record again</button>
    </div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const rerecordBtn = document.getElementById('rerecordBtn');
  const recorderEl = document.getElementById('recorder');
  const timerEl = document.getElementById('timer');
  const statusText = document.getElementById('statusText');
  const playback = document.getElementById('playback');
  const audioPlayback = document.getElementById('audioPlayback');
  const guestNameInput = document.getElementById('guestName');
  const eventNameEl = document.getElementById('eventName');

  let mediaRecorder = null;
  let audioChunks = [];
  let activeStream = null;
  let timerInterval = null;
  let seconds = 0;
  let currentEvent = null; // { id, couple_name, slug }

  function formatTime(totalSeconds){
    const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    return m + ':' + s;
  }

  function supportsRecording(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  function pickMimeType(){
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus',
      'audio/ogg'
    ];
    for (var i = 0; i < candidates.length; i++){
      if (MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return '';
  }

  function disableForm(message){
    startBtn.disabled = true;
    guestNameInput.disabled = true;
    statusText.className = 'status error';
    statusText.textContent = message;
  }

  async function loadEvent(){
    const params = new URLSearchParams(location.search);
    const slug = params.get('event');

    if (!slug){
      eventNameEl.textContent = 'Missing link';
      disableForm('This link is missing an event. Please ask for the correct guestbook link.');
      return;
    }

    const { data, error } = await supabaseClient
      .from('ag_events')
      .select('id, couple_name, slug, status')
      .eq('slug', slug)
      .single();

    if (error || !data){
      eventNameEl.textContent = 'Not found';
      disableForm("We couldn't find this guestbook. Please check the link.");
      return;
    }

    currentEvent = data;
    eventNameEl.textContent = data.couple_name;

    if (data.status !== 'approved'){
      disableForm("This guestbook isn't active yet. Please check back soon, or contact the couple.");
      return;
    }

    if (!supportsRecording()){
      disableForm("Audio recording isn't supported in this browser. Try a recent version of Chrome, Safari, or Firefox.");
      return;
    }

    statusText.className = 'status';
    statusText.textContent = "Tap Start Recording when you're ready.";
  }

  startBtn.addEventListener('click', async function(){
    if (!currentEvent) return;

    if (!guestNameInput.value.trim()){
      statusText.className = 'status error';
      statusText.textContent = 'Please add your name first, so we know who left the message.';
      guestNameInput.focus();
      return;
    }

    audioChunks = [];
    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err){
      statusText.className = 'status error';
      statusText.textContent = "We couldn't access your microphone. Please check your browser permissions and try again.";
      return;
    }

    const mimeType = pickMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(activeStream, { mimeType }) : new MediaRecorder(activeStream);

    mediaRecorder.addEventListener('dataavailable', function(e){
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    });

    mediaRecorder.addEventListener('stop', async function(){
      const actualType = mediaRecorder.mimeType || 'audio/webm';
      const blob = new Blob(audioChunks, { type: actualType });
      const localUrl = URL.createObjectURL(blob);
      audioPlayback.src = localUrl;
      playback.hidden = false;
      if (activeStream) activeStream.getTracks().forEach(function(track){ track.stop(); });

      statusText.className = 'status';
      statusText.textContent = 'Uploading your message…';

      const guestName = guestNameInput.value.trim() || 'A guest';
      const extension = actualType.indexOf('mp4') !== -1 ? 'm4a'
        : actualType.indexOf('ogg') !== -1 ? 'ogg'
        : 'webm';
      const fileName = `${currentEvent.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${extension}`;

      const { error: uploadError } = await supabaseClient
        .storage
        .from('ag-recordings')
        .upload(fileName, blob, { contentType: actualType });

      if (uploadError){
        statusText.className = 'status error';
        statusText.textContent = "We saved your recording here, but couldn't upload it. Please check your connection and try again.";
        return;
      }

      const { error: insertError } = await supabaseClient
        .from('ag_messages')
        .insert({ event_id: currentEvent.id, guest_name: guestName, audio_path: fileName });

      if (insertError){
        statusText.className = 'status error';
        statusText.textContent = 'Your recording uploaded, but we could not save it to the guestbook. Please try again.';
        return;
      }

      statusText.className = 'status success';
      statusText.textContent = 'Message recorded — thank you!';
    });

    mediaRecorder.start();
    recorderEl.classList.add('recording');
    startBtn.disabled = true;
    stopBtn.disabled = false;
    playback.hidden = true;
    statusText.className = 'status';
    statusText.textContent = 'Recording… speak your message.';

    seconds = 0;
    timerEl.textContent = '00:00';
    timerInterval = setInterval(function(){
      seconds += 1;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  });

  stopBtn.addEventListener('click', function(){
    if (mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
    clearInterval(timerInterval);
    recorderEl.classList.remove('recording');
    stopBtn.disabled = true;
    startBtn.disabled = false;
  });

  rerecordBtn.addEventListener('click', function(){
    playback.hidden = true;
    seconds = 0;
    timerEl.textContent = '00:00';
    statusText.className = 'status';
    statusText.textContent = "Tap Start Recording when you're ready.";
  });

  loadEvent();
})();
</script>

</body>
</html>
